<style>

function equipes() {
  const eq = {};
  BDRS.forEach((b) => { const e = P(b).equipe; eq[e] = eq[e] || { nome: e, valor: 0, vendas: 0, bdrs: 0 }; eq[e].valor += DB.vendido[b]; eq[e].bdrs++; if (DB.vendido[b]) eq[e].vendas += Math.max(1, Math.round(DB.vendido[b] / 9000)); });
  return Object.values(eq).sort((a, b) => b.valor - a.valor);
}
function negociacao() {
  const m = {};
  DB.deals.filter((d) => !d.ganho && d.etapa >= 5 && BDRS.includes(d.ini)).forEach((d) => { m[d.ini] = m[d.ini] || { ini: d.ini, valor: 0, n: 0, fr: new Set() }; m[d.ini].valor += (d.valorNeg || d.valor); m[d.ini].n++; m[d.ini].fr.add(d.frente); });
  return Object.values(m).sort((a, b) => b.n - a.n || b.valor - a.valor);
}

function setRole(r) { DB.role = r; render(); }
function decidir(id, ok) {
  const v = DB.validacoes.find((x) => x.id === id); v.dec = ok ? 'ok' : 'no';
  const h = PTS_HIST[v.ini] = PTS_HIST[v.ini] || []; const hi = h.find((x) => x[0] === v.empresa && (x[4] === 'enviada' || x[4] === 'aberta'));
  if (v.tipo === 'Contestação de ponto') { if (ok && hi) h.splice(h.indexOf(hi), 1); else if (hi) hi[4] = 'recusada'; }
  else if (!ok && !isCoord(v.ini)) h.unshift([v.empresa, v.etapa, '“Outro motivo” rejeitado', '14 out', 'aberta']);
  if (!ok && v.tipo === 'Contestação de ponto') toast(`Contestação recusada: o ponto de ${P(v.ini).nome} continua no contador. A decisão é final.`, 'in');
  else if (!ok && isCoord(v.ini)) toast(`Rejeitada. Card de coordenador não gera ponto: conversa individual com ${P(v.ini).nome}.`, 'in');
  else if (!ok) { P(v.ini).pontos = (P(v.ini).pontos || 0) + 1; toast(`Rejeitada: 1 ponto aplicado a ${P(v.ini).nome}.`, 'er'); }
  else toast(v.tipo === 'Contestação de ponto' ? `Contestação aceita: o ponto saiu do contador de ${P(v.ini).nome}.` : 'Justificativa validada. Card fora do vermelho, sem ponto.', 'ok');
  if (ok && v.tipo === 'Contestação de ponto' && !isCoord(v.ini)) P(v.ini).pontos = Math.max(0, (P(v.ini).pontos || 0) - 1);
  render();
}

function distribuir(ini) {
  const outros = BDRS.filter((b) => b !== ini); let n = 0;

  fecharModal(); toast(`${n} cards de ${P(ini).nome} distribuídos aleatoriamente. Acesso fechado.`, 'ok');
}

let ETQ = false;

function filtrarEtq(q) {
  q = q.toLowerCase();
  document.querySelectorAll('.etq-op').forEach((el) => { el.style.display = el.dataset.n.toLowerCase().includes(q) ? '' : 'none'; });
  document.querySelectorAll('.etq-gr').forEach((g) => { g.style.display = [...g.querySelectorAll('.etq-op')].some((o) => o.style.display !== 'none') ? '' : 'none'; });
}
function toggleEscopo(id, e) {
  const d = DB.deals.find((x) => x.id === id) || DB.fidel.find((x) => x.id === id);
  d.escopos = d.escopos || [];
  if (d.escopos.includes(e)) d.escopos = d.escopos.filter((x) => x !== e); else d.escopos.push(e);
  const fs = [...new Set(d.escopos.map(frenteDe))];
  if (fs.length && d.frente !== undefined && !fs.includes(d.frente)) d.frente = fs[0];
  const q = (document.getElementById('etqBusca') || {}).value || '';

}

    ${ETQ ? `<div class="etq-pop" onclick="event.stopPropagation()"><div class="etq-search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#3C4043" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="etqBusca" placeholder="Buscar etiquetas" oninput="filtrarEtq(this.value)"></div>
      <div class="etq-list">${Object.entries(FRENTES).map(([fr, f]) => `<div class="etq-gr"><div class="etq-h"><span class="dot" style="background:${f.cor}"></span>${fr}</div>${f.escopos.map((e) => `<button class="etq-op" data-n="${esc(e + ' ' + fr)}" onclick="toggleEscopo('${d.id}','${esc(e)}')">${lbl(e)}${sel.includes(e) ? `<span class="etq-ck">${icon('check', '#1A73E8', 16)}</span>` : ''}</button>`).join('')}</div>`).join('')}</div>
      <div class="etq-foot"><span class="small muted">Escopos das cartilhas de vendas · Direito provisório</span><button class="btn s" onclick="toggleEtq()">Concluir</button></div></div>` : ''}</div>`;
}

// ================= VALOR NEGOCIADO =================
function salvarValor(id) {
  const d = DB.deals.find((x) => x.id === id);
  const n = (s) => Number(String(s || '').replace(/\D/g, '')) || 0;
  const prop = n($('#vProp').value), neg = n($('#vNeg').value);
  if (!neg) { toast('Digite o valor negociado.', 'er'); return; }
  d.valor = prop || d.valor; d.valorNeg = neg; d.pagto = $('#vPag').value; d.diasNeg = $('#vDias').value;
  d.negHist = d.negHist || [];
  d.negHist.unshift({ v: neg, q: 'agora · ' + P(d.ini).nome, obs: $('#vObs').value || '' });
  d.historico.unshift({ t: 'Valor negociado: ' + fmt(neg), q: 'agora · ' + P(d.ini).nome, c: '#2563EB' });
  render(); toast(`Valor negociado de ${fmt(neg)} salvo. Ele aparece no card e no Placar.`, 'ok');
}
function valoresHtml(d) {
  const prop = d.valor || 0, neg = d.valorNeg || 0;
  const desc = prop && neg ? Math.round((1 - neg / prop) * 100) : 0;
  return `<p class="small muted" style="margin:0 0 14px">Registre aqui cada rodada da negociação. O último valor negociado aparece no card, no ganho e no ranking de propostas em negociação.</p>
  <div class="grid g3" style="gap:12px;margin-bottom:16px">
    <div class="vbox"><div class="small muted">Valor da proposta</div><b>${fmt(prop).replace('Sem valor', '—')}</b></div>
    <div class="vbox" style="background:var(--blues);border-color:#BFDBFE"><div class="small" style="color:#1E40AF">Valor negociado</div><b style="color:#1E3A8A">${neg ? fmt(neg) : '—'}</b></div>
    <div class="vbox"><div class="small muted">Desconto</div><b style="color:${desc > 15 ? 'var(--redd)' : 'var(--ink)'}">${neg && prop ? desc + '%' : '—'}</b>${desc > 15 ? '<div class="small" style="color:var(--redd)">acima de 15%: alinhar com a coordenação</div>' : ''}</div>
  </div>
  <div class="grid g2" style="gap:12px">
    <label class="f">Valor da proposta (R$)<input class="in" id="vProp" value="${prop || ''}" placeholder="Ex.: 22000"></label>
    <label class="f">Valor negociado (R$)<input class="in" id="vNeg" value="${neg || ''}" placeholder="Ex.: 19800"></label>
    <label class="f">Dias úteis<input class="in" id="vDias" value="${esc(d.diasNeg || d.dias || '25')}"></label>
    <label class="f">Condição de pagamento<select class="in" id="vPag">${['À vista', '2x sem juros', '3x sem juros', '50% na assinatura + 50% na entrega'].map((o) => `<option ${d.pagto === o ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
  </div>
  <label class="f" style="margin-top:12px">O que mudou nesta rodada<input class="in" id="vObs" placeholder="Ex.: tiramos o treinamento e reduzimos 3 dias úteis"></label>
  <div class="row" style="margin-top:14px"><button class="btn p" onclick="salvarValor('${d.id}')">Salvar valor negociado</button></div>
  ${(d.negHist || []).length ? `<div style="margin-top:18px"><div class="small b6 muted" style="margin-bottom:6px">Rodadas de negociação</div>${d.negHist.map((h) => `<div class="kv"><span>${h.q}${h.obs ? ' · ' + esc(h.obs) : ''}</span><span class="b6">${fmt(h.v)}</span></div>`).join('')}</div>` : ''}`;
}

// ================= NOVOS BLOCOS DO PAINEL =================
const VENDIDO_FRENTE = { Business: { 'Planejamento financeiro': 52400, 'Pesquisa de mercado': 31500, 'Estratégia de marketing': 24800, 'Mapeamento de operação': 9800 }, Tech: { 'Desenvolvimento web': 14000, 'Chatbot com IA': 6500, 'Automação': 3200 }, Direito: { 'Contratos': 7200, 'Societário': 3000, 'Tributário': 0, 'Pesquisa legislativa': 2400 }, Processos: { 'Gestão de estoque': 0, 'Otimização de processos industriais': 6300 } };
function painelFrentes() {
  const neg = {}; Object.keys(FRENTES).forEach((f) => { neg[f] = 0; });
  DB.deals.filter((d) => !d.ganho && d.etapa >= 3).forEach((d) => { const fs = [...new Set((d.escopos || []).map(frenteDe))]; const alvo = fs.length ? fs : [d.frente]; alvo.forEach((f) => { if (neg[f] != null) neg[f] += (d.valorNeg || d.valor) / alvo.length; }); });
  const tot = (f) => Object.values(VENDIDO_FRENTE[f]).reduce((s, v) => s + v, 0);
  const total = Object.keys(FRENTES).reduce((s, f) => s + tot(f), 0);
  const mx = Math.max(...Object.keys(FRENTES).map(tot));
  return `<div style="display:flex;height:12px;border-radius:99px;overflow:hidden;margin-bottom:6px">${Object.entries(FRENTES).map(([f, c]) => `<span style="width:${tot(f) / total * 100}%;background:${c.cor}" title="${f}"></span>`).join('')}</div>
    <div class="row small" style="gap:14px;margin-bottom:16px">${Object.entries(FRENTES).map(([f, c]) => `<span class="row" style="gap:6px"><span class="dot" style="background:${c.cor}"></span>${f} ${Math.round(tot(f) / total * 100)}%</span>`).join('')}</div>
    ${Object.entries(FRENTES).map(([f, c]) => `<details class="fr" ${f === 'Direito' || f === 'Processos' ? 'open' : ''}><summary><span class="row" style="gap:8px"><span class="dot" style="background:${c.cor}"></span><b>${f}</b></span><span class="row" style="gap:14px"><span class="small muted">negociação ${fmt(Math.round(neg[f])).replace('Sem valor', 'R$ 0')}</span><b>${fmt(tot(f)).replace('Sem valor', 'R$ 0')}</b></span></summary>
      ${Object.entries(VENDIDO_FRENTE[f]).map(([e, v]) => `<div style="display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 84px;gap:10px;align-items:center;padding:6px 0 6px 18px;font-size:13px"><span>${e}</span><div class="bar" style="height:6px"><i style="width:${v / mx * 100}%;background:${c.cor}"></i></div><span style="text-align:right" class="${v ? '' : 'muted'}">${v ? fmt(v) : 'sem venda'}</span></div>`).join('')}</details>`).join('')}
    <div class="note a" style="margin-top:12px">${icon('info')}Direito e Processos somam ${Math.round((tot('Direito') + tot('Processos')) / total * 100)}% do vendido. Tributário e Gestão de estoque ainda não venderam no semestre.</div>`;
}
function painelPreco() {
  const reais = DB.deals.filter((d) => d.valorNeg && d.valor);
  const base = [['Business', 22000, 8], ['Tech', 18500, 5], ['Direito', 9500, 12], ['Processos', 18000, 6]];
  const bdr = [['Ana Lima', 7], ['Carla Mendes', 14], ['Luiza Faria', 4], ['Bruno Sato', 18], ['Diego Rocha', 9]];
  return `<div class="grid g3" style="gap:12px;margin-bottom:18px">
      <div class="vbox"><div class="small muted">Desconto médio</div><b>9%</b><div class="small muted">meta: até 10%</div></div>
      <div class="vbox"><div class="small muted">Ticket médio</div><b>R$ 17.400</b><div class="small muted">valor negociado</div></div>
      <div class="vbox"><div class="small muted">Negociações registradas</div><b>${23 + reais.length}</b><div class="small muted">rodadas no semestre</div></div></div>
    <div class="tblw"><table class="tbl"><thead><tr><th>Frente</th><th>Ticket médio</th><th>Desconto médio</th></tr></thead><tbody>${base.map(([f, t, dsc]) => `<tr><td><span class="row" style="gap:8px"><span class="dot" style="background:${FRENTES[f].cor}"></span>${f}</span></td><td>${fmt(t)}</td><td class="b6" style="color:${dsc > 10 ? 'var(--redd)' : 'var(--ink)'}">${dsc}%</td></tr>`).join('')}</tbody></table></div>
    <div class="small muted" style="margin:16px 0 8px">Desconto médio por BDR</div>
    ${bdr.map(([n, dsc]) => `<div style="display:grid;grid-template-columns:120px minmax(0,1fr) 40px;gap:10px;align-items:center;margin-bottom:7px;font-size:13px"><span>${n}</span><div class="bar" style="height:7px"><i style="width:${dsc / 20 * 100}%;background:${dsc > 15 ? '#DC2626' : dsc > 10 ? '#F59E0B' : '#16A34A'}"></i></div><b style="text-align:right">${dsc}%</b></div>`).join('')}
    <div class="small muted" style="margin:16px 0 8px">Condição de pagamento</div>
    <div class="chips"><span class="chip">À vista <b>41%</b></span><span class="chip">50% + 50% <b>33%</b></span><span class="chip">2x <b>15%</b></span><span class="chip">3x <b>11%</b></span></div>
    <div class="info" style="margin-top:14px">Dias úteis vendidos × realizados entram aqui quando “Meus projetos” passar a informar os dias de cada projeto.</div>`;
}
function painelCapacitacao() {
  const st = (k) => k.lib ? ['Liberado', 'p-g', 'desde ' + k.lib] : (k.proc >= MIN_PROVA.processo && k.esc >= MIN_PROVA.escopos && k.prop) ? ['Acompanhado', 'p-a', 'conduz entendimentos'] : ['Refaz prova', 'p-r', 'abaixo do mínimo'];
  const lib = BDRS.filter((b) => CAP[b].lib).length;
  return `<div class="grid g3" style="gap:12px;margin-bottom:18px">
      <div class="vbox" style="background:var(--greens);border-color:var(--greenb)"><div class="small" style="color:var(--greend)">Liberados para vender sozinhos</div><b style="color:var(--green)">${lib} de ${BDRS.length}</b><div class="small" style="color:var(--greend)">semestre 2026.2</div></div>
      <div class="vbox"><div class="small muted">Nota mínima das provas</div><b>${String(MIN_PROVA.processo).replace('.', ',')} · ${String(MIN_PROVA.escopos).replace('.', ',')}</b><div class="small muted">processo · escopos (média dos coordenadores)</div></div>
      <div class="vbox"><div class="small muted">Meta de liberação</div><b>Todos</b><div class="small muted">até a entrega intermediária do trainee</div></div></div>
    <div class="tblw"><table class="tbl"><thead><tr><th>BDR</th><th>Provas</th><th>Entendimentos</th><th>Situação</th></tr></thead><tbody>${BDRS.map((i) => { const k = CAP[i]; const s = st(k); const ok = [k.proc >= MIN_PROVA.processo, k.esc >= MIN_PROVA.escopos, !!k.prop].filter(Boolean).length; return `<tr class="click" onclick="PAB='capacitacao';go('pessoa','${i}')"><td><span class="who">${av(i)}${P(i).nome}</span></td><td class="b6" style="color:${ok < 3 ? 'var(--redd)' : 'var(--ink)'}">${ok}/3</td><td>${k.ent.filter((e) => e[0] === 5).length}/3</td><td><span class="pill ${s[1]}">${s[0]}</span> <span class="small muted">${s[2]}</span></td></tr>`; }).join('')}</tbody></table></div>
    <div class="small muted" style="margin:16px 0 8px">Item do checklist mais esquecido nos entendimentos</div>
    <div class="chips"><span class="chip">Quem decide <b>faltou em 1 de 19</b></span><span class="chip">Prova com menor nota: escopos <b>7,8</b></span></div>`;
}
function painelCampanhas() {
  const c = [['Google Ads · consultoria financeira pme', 'Business', 'Midas', 3200, 21, 6, 3], ['Google Ads · abrir empresa', 'Direito', 'Midas', 1400, 9, 2, 1], ['Google Ads · planejamento estratégico', 'Business', 'Midas', 1800, 11, 3, 1], ['LinkedIn Ads · automação para PMEs', 'Tech', 'LinkedIn', 900, 4, 1, 0], ['LinkedIn Ads · melhoria de processos', 'Processos', 'LinkedIn', 700, 3, 1, 0]];
  const tl = c.reduce((s, x) => s + x[4], 0), tc = c.reduce((s, x) => s + x[3], 0), tv = c.reduce((s, x) => s + x[6], 0);
  return `<div class="grid g3" style="gap:12px;margin-bottom:18px">
      <div class="vbox"><div class="small muted">Investido no semestre</div><b>${fmt(tc)}</b></div>
      <div class="vbox"><div class="small muted">Custo por entendimento</div><b>${fmt(Math.round(tc / c.reduce((s, x) => s + x[5], 0)))}</b></div>
      <div class="vbox"><div class="small muted">Custo por venda</div><b>${fmt(Math.round(tc / tv))}</b></div></div>
    <div class="tblw"><table class="tbl"><thead><tr><th>Campanha</th><th>Leads</th><th>Entendimentos</th><th>Vendas</th><th>Custo/entendimento</th></tr></thead><tbody>${c.map(([n, f, o, custo, l, p, v]) => `<tr><td><span class="row" style="gap:8px;flex-wrap:nowrap"><span class="dot" style="background:${FRENTES[f].cor}"></span><span><span style="font-weight:500">${n}</span><br><span class="small muted">${o} · ${fmt(custo)}</span></span></span></td><td>${l}</td><td>${p}</td><td class="b6">${v}</td><td>${fmt(Math.round(custo / Math.max(1, p)))}</td></tr>`).join('')}</tbody></table></div>
    <div class="info" style="margin-top:14px">Para este painel funcionar, cada lead da passiva precisa chegar com a campanha e a frente de origem. Isso faz parte da proposta de Geração de Demanda e Conversão (acompanhamento quinzenal da passiva com a agência).</div>`;
}
// ================= INÍCIO DA APLICAÇÃO =================
render();
setTimeout(() => toast('Protótipo navegável do CRM comercial. Os dados são fictícios.', 'in'), 400);
</script>
</body>
</html>
